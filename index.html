    :root {
      --primary-neon: #00f0ff;
      --secondary-neon: #ff007f;
      --bg-dark: #0a0a0f;
      --card-bg: #12131c;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: url('Images/fondo.webp') center/cover no-repeat;
      filter: blur(20px) brightness(0.4);
      z-index: -1;
    }

    body {
      background-color: var(--bg-dark);
      color: #ffffff;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .logo-img {
      max-height: 200px;
      object-fit: contain;
      filter: drop-shadow(0 0 15px rgba(0, 240, 255, 0.4));
    }

    .set-card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 20px;
      transition: all 0.3s ease;
      text-decoration: none !important;
      color: inherit;
      display: block;
      height: 100%;
      position: relative;
    }

    .set-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 10px 30px rgba(0, 240, 255, 0.3), 0 0 20px rgba(255, 0, 127, 0.3);
    }

    .cover-img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    .year-badge {
      font-size: 0.75rem;
      letter-spacing: 1px;
      padding: 4px 10px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .pointing-hand {
      font-size: 1.8rem;
      animation: bounceHand 1.2s infinite ease-in-out;
      display: inline-block;
    }

    @keyframes bounceHand {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(8px); }
    }
    .main-footer {
      width: 100%;
      background-color: #080a0f;
      border-top: 1px solid rgba(0, 229, 255, 0.2);
      box-shadow: 0 -8px 25px rgba(0, 0, 0, 0.6);
      color: #a0a5b5;
      padding: 40px 20px 25px 20px;
      margin-top: 80px;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .footer-content {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 25px;
      padding-bottom: 25px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .footer-logo {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 3px;
      color: #ffffff;
      margin: 0;
      text-shadow: 0 0 12px rgba(0, 229, 255, 0.6);
    }

    .footer-tagline {
      font-size: 0.85rem;
      color: #62697a;
      margin: 4px 0 0 0;
      letter-spacing: 0.5px;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .footer-links a {
      color: #b0b8c8;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: all 0.25s ease;
    }

    .footer-links a:hover {
      color: #00e5ff;
      border-color: rgba(0, 229, 255, 0.4);
      background: rgba(0, 229, 255, 0.08);
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
      transform: translateY(-2px);
    }

    .footer-links svg {
      transition: transform 0.25s ease;
    }

    .footer-links a:hover svg {
      transform: scale(1.1);
    }

    .footer-bottom {
      max-width: 1100px;
      margin: 20px auto 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 0.8rem;
      color: #525866;
    }

    .footer-bottom strong {
      color: #d0d5e0;
    }

    .footer-host-note {
      font-size: 0.75rem;
      color: #404654;
    }

    /* Responsivo para celulares */
    @media (max-width: 650px) {
      .footer-content {
        flex-direction: column;
        text-align: center;
      }

      .footer-links {
        justify-content: center;
      }

      .footer-bottom {
        flex-direction: column;
        text-align: center;
      }
    }
  </style>
</head>

    const container = document.getElementById('sets-container');
    const searchInput = document.getElementById('search-input');

    // DIBUJA, ORDENA Y FILTRA LOS SETS EN PANTALLA
    function renderSets(filterQuery = "") {
      container.innerHTML = "";
      const query = filterQuery.toLowerCase().trim();

      // 1. Filtrar sets por Título, Descripción, Año o Mes (nombre o número)
      const filteredSets = sets.filter(set => {
        if (!set.visible) return false;

        const mName = monthNames[set.month - 1].toLowerCase();
        const mNum = set.month.toString();
        const mNumPad = set.month.toString().padStart(2, '0'); // '04', '06', etc.

        const matchesTitle = set.title.toLowerCase().includes(query);
        const matchesDesc = set.desc.toLowerCase().includes(query);
        const matchesYear = set.year.toString().includes(query);
        const matchesMonth = mName.includes(query) || mNum === query || mNumPad === query;

        return matchesTitle || matchesDesc || matchesYear || matchesMonth;
      });

      // 2. Ordenar cronológicamente: Primero por AÑO (descendente), luego por MES (descendente)
      filteredSets.sort((a, b) => {
        if (b.year !== a.year) {
          return b.year - a.year;
        }
        return b.month - a.month;
      });

      // Si no hay resultados
      if (filteredSets.length === 0) {
        container.innerHTML = `
          <div class="col-12 my-4">
            <p style="color:white;">No se encontraron sets que coincidan con "${filterQuery}".</p>
          </div>`;
        return;
      }

      // 3. Renderizar las tarjetas
      filteredSets.forEach(set => {
        const cardCol = document.createElement('div');
        cardCol.className = 'col-12 col-md-6 col-lg-4';
        const displayMonth = monthNames[set.month - 1];
        
        cardCol.innerHTML = `
          <a href="${set.url}" class="set-card" style="border-color: ${set.colorPrimary}40;">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <span class="year-badge text-uppercase fw-semibold" style="color: ${set.colorPrimary}; border-color: ${set.colorPrimary}60;">
                <i class="bi bi-calendar3 me-1"></i>Rec. ${displayMonth} ${set.year}
              </span>
            </div>
            <img src="${set.img}" alt="${set.title} Cover" class="cover-img mb-3" onerror="this.src='Images/set1_11.webp'">
            <h4 class="fw-bold text-uppercase" style="color: ${set.colorPrimary};">${set.title}</h4>
            <p class="small mb-3" style="color:white;">${set.desc}</p>
            <div>
              <i class="bi bi-hand-index-thumb-fill pointing-hand me-1" style="color:white;"></i>
              <span class="small fw-bold text-uppercase" style="color: ${set.colorSecondary};">Escuchar</span>
            </div>
          </a>
        `;
        container.appendChild(cardCol);
      });
    }

    // Escuchar la búsqueda en tiempo real
    searchInput.addEventListener('input', (e) => {
      renderSets(e.target.value);
    });

    // Carga inicial
    renderSets();
  </script>
