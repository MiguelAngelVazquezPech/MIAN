<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Delirium - Welcome</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <style>
    :root {
      --primary-neon: #00f0ff;
      --secondary-neon: #ff007f;
      --bg-dark: #0a0a0f;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: url('fondo.jpg') center/cover no-repeat;
      filter: blur(20px) brightness(0.4);
      z-index: -1;
    }

    .logo-img {
      max-height: 300px;
      object-fit: contain;
      filter: drop-shadow(0 0 12px rgba(0, 240, 255, 0.5));
    }

    .cover-container {
      max-width: 360px;
      margin: 0 auto;
    }

    .cover-img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(255, 0, 127, 0.4), 0 0 15px rgba(0, 240, 255, 0.4);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }

    .cover-container:hover .cover-img {
      transform: scale(1.04);
      box-shadow: 0 0 40px rgba(255, 0, 127, 0.7), 0 0 25px rgba(0, 240, 255, 0.6);
    }

    .pointing-hand {
      font-size: 3.2rem;
      color: var(--primary-neon);
      text-shadow: 0 0 15px var(--primary-neon);
      animation: bounceHand 1.2s infinite ease-in-out;
      display: inline-block;
    }

    @keyframes bounceHand {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(14px); }
    }

    .enter-btn-text {
      color: #ffffff;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-size: 1.1rem;
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.6);
    }
  </style>
</head>
<body>

  <div class="container text-center py-5">
    
    <!-- 1. LOGO -->
    <div class="mb-4">
      <!-- Cambia 'logo.png' por tu archivo de logo -->
      <img src="logo.png" alt="DJ Logo" class="logo-img img-fluid" onerror="this.style.display='none'; document.getElementById('alt-title').style.display='block';">
      <h1 id="alt-title" class="fw-bold display-4" style="display:none; color: var(--primary-neon);">YOUR LOGO</h1>
    </div>

    <!-- 2. BOTÓN DE IMAGEN 1:1 QUE REDIRIGE A SET.HTML -->
    <div class="cover-container">
      <a href="set.html" class="text-decoration-none d-block">
        <img src="imagecuadro.png" alt="Digital Delirium Cover" class="cover-img mb-3">
      
        <p class="enter-btn-text mt-2">¡Haz Clic para Escuchar el Set!</p>
      </a>
    </div>

  </div>

</body>
</html>
