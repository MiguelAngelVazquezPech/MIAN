    ];

    // Se ordena y se prepara UNA sola vez (más reciente primero: año y luego mes)
    const catalog = sets
      .filter(s => s.visible)
      .sort((a, b) => b.year - a.year || b.month - a.month)
      .map(s => {
        const mName = monthNames[s.month - 1];
        return {
          s, mName,
          fields: [s.title, s.desc, String(s.year), mName].map(t => t.toLowerCase()),
          mNum: String(s.month),
          mNumPad: String(s.month).padStart(2, '0')
        };
      });

    const container = document.getElementById('sets-container');
    const searchInput = document.getElementById('search-input');

    // Las 3 primeras portadas cargan de inmediato; el resto, solo al acercarse en el scroll
    const cardHTML = ({ s, mName }, i) => `
      <div class="col-12 col-md-6 col-lg-4">
        <a href="${s.url}" class="set-card" style="border-color:${s.colorPrimary}40">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="year-badge text-uppercase fw-semibold" style="color:${s.colorPrimary};border-color:${s.colorPrimary}60">
              <svg class="ico me-1"><use href="#i-calendar3"/></svg>Rec. ${mName} ${s.year}
            </span>
          </div>
          <img src="${s.img}" alt="${s.title} Cover" class="cover-img mb-3" width="350" height="350"${i < 3 ? '' : ' loading="lazy"'} decoding="async" onerror="this.onerror=null;this.src='Images/set1_11.webp'">
          <h4 class="fw-bold text-uppercase" style="color:${s.colorPrimary}">${s.title}</h4>
          <p class="small mb-3">${s.desc}</p>
          <div class="set-cta">
            <svg class="ico pointing-hand me-1"><use href="#i-hand-index-thumb-fill"/></svg>
            <span class="small fw-bold text-uppercase" style="color:${s.colorSecondary}">Escuchar</span>
          </div>
        </a>
      </div>`;

    // Dibuja los sets que coinciden con la búsqueda (título, descripción, año o mes)
    function renderSets(rawQuery = '') {
      const q = rawQuery.toLowerCase().trim();
      const list = q
        ? catalog.filter(c => c.fields.some(f => f.includes(q)) || c.mNum === q || c.mNumPad === q)
        : catalog;

      if (!list.length) {
        const box = document.createElement('div');
        box.className = 'col-12 my-4';
        const p = document.createElement('p');
        p.className = 'text-white';
        p.textContent = `No se encontraron sets que coincidan con "${rawQuery}".`;
        box.appendChild(p);
        container.replaceChildren(box);
        return;
      }
      container.innerHTML = list.map(cardHTML).join('');
    }

    // Búsqueda en tiempo real (espera 150 ms después de la última tecla)
    let searchTimer;
    searchInput.addEventListener('input', e => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => renderSets(e.target.value), 150);
    });

    renderSets();

    // ===== MENÚ FLOTANTE =====
    const fabMenu = document.getElementById('fabMenu');
    const fabToggle = document.getElementById('fabToggle');
    const fabBackdrop = document.getElementById('fabBackdrop');

    function setFab(open) {
      fabMenu.classList.toggle('open', open);
      fabBackdrop.classList.toggle('show', open);
      fabToggle.setAttribute('aria-expanded', open);
      fabToggle.setAttribute('aria-label', open ? 'Cerrar menú' : 'Abrir menú');
    }

    fabToggle.addEventListener('click', () => setFab(!fabMenu.classList.contains('open')));
    fabBackdrop.addEventListener('click', () => setFab(false));
    document.addEventListener('keydown', e => { if (e.key === 'Escape') setFab(false); });
    // Si el usuario regresa con el botón "atrás", el menú no debe quedar abierto
    window.addEventListener('pageshow', () => setFab(false));
  </script>
