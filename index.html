<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIAN - Official DJ Sets</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <style>
    :root {
      --primary-neon: #00f0ff;
      --secondary-neon: #ff007f;
      --bg-dark: #0a0a0f;
      --card-bg: #12131c;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: url('fondo.jpg') center/cover no-repeat;
      filter: blur(20px) brightness(0.4);
      z-index: -1;
    }

    .logo-img {
      max-height: 100px;
      object-fit: contain;
      filter: drop-shadow(0 0 15px rgba(0, 240, 255, 0.4));
    }

    .set-card {
      background: var(--card-bg);
      border: 1px solid rgba(0, 240, 255, 0.2);
      border-radius: 20px;
      padding: 20px;
      transition: all 0.3s ease;
      text-decoration: none !important;
      color: inherit;
      display: block;
      height: 100%;
    }

    .set-card:hover {
      transform: translateY(-8px);
      border-color: var(--primary-neon);
      box-shadow: 0 10px 30px rgba(0, 240, 255, 0.3), 0 0 20px rgba(255, 0, 127, 0.3);
    }
    .set-card-gold:hover {
      border-color: #ff9d00 !important;
      box-shadow: 0 10px 30px rgba(255, 157, 0, 0.4), 0 0 20px rgba(255, 51, 0, 0.3) !important;
    }
    .cover-img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    .pointing-hand {
      font-size: 2rem;
      color: var(--primary-neon);
      animation: bounceHand 1.2s infinite ease-in-out;
      display: inline-block;
    }

    @keyframes bounceHand {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(8px); }
    }
  </style>
</head>
<body>

  <div class="container text-center py-5">
    
    <!-- LOGO MIAN -->
    <div class="mb-5">
      <img src="logo.png" alt="MIAN Logo" class="logo-img img-fluid">
    </div>

    <h2 class="fw-bold mb-4" style="color: var(--primary-neon); letter-spacing: 2px;">SELECCIONA UN SET</h2>

    <!-- GRID DE SETS (2 COLUMNAS) -->
    <div class="row g-4 justify-content-center">
      
      <!-- SET 1: DIGITAL DELIRIUM -->
      <div class="col-md-5 col-lg-4">
        <a href="set1.html" class="set-card">
          <img src="set1_11.png" alt="Digital Delirium Cover" class="cover-img mb-3">
          <h4 class="fw-bold text-uppercase" style="color: var(--primary-neon);">Digital Delirium</h4>
          <p class="small mb-2" style="color:white;">30 Tracks - Tech / Progressive / Bass</p>
          <div>
            <i class="bi bi-hand-index-thumb-fill pointing-hand me-1"></i>
            <span class="small fw-bold text-uppercase" style="color: var(--secondary-neon);">Escuchar Set 1</span>
          </div>
        </a>
      </div>
      <!-- SET 2: HOUSE NATION -->
      <div class="col-md-5 col-lg-4 d-none">
        <a href="set2.html" class="set-card set-card-gold">
          <!-- Asegúrate de que el nombre coincida con tu imagen cuadrada -->
          <img src="set2_11.png" alt="House Nation Cover" class="cover-img mb-3">
          <h4 class="fw-bold text-uppercase" style="color: #ff9d00;">House Nation</h4>
          <p class="small mb-2">14 Tracks - Vocal House / Festival EDM</p>
          <div>
            <i class="bi bi-hand-index-thumb-fill pointing-hand me-1" style="color: #ff9d00;"></i>
            <span class="small fw-bold text-uppercase" style="color: #ff3300;">Escuchar Set 2</span>
          </div>
        </a>
      </div>

    </div>

  </div>

</body>
</html>
