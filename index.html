<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIAN - Official DJ Sets</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <style>
    :root {
      --primary-neon: #00f0ff;
      --secondary-neon: #ff007f;
      --bg-dark: #0a0a0f;
      --card-bg: #12131c;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: url('Images/fondo.jpg') center/cover no-repeat;
      filter: blur(20px) brightness(0.4);
      z-index: -1;
    }

    body {
      background-color: var(--bg-dark);
      color: #ffffff;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .logo-img {
      max-height: 100px;
      object-fit: contain;
      filter: drop-shadow(0 0 15px rgba(0, 240, 255, 0.4));
    }

    .set-card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 20px;
      transition: all 0.3s ease;
      text-decoration: none !important;
      color: inherit;
      display: block;
      height: 100%;
    }

    .set-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 10px 30px rgba(0, 240, 255, 0.3), 0 0 20px rgba(255, 0, 127, 0.3);
    }

    .cover-img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    .pointing-hand {
      font-size: 1.8rem;
      animation: bounceHand 1.2s infinite ease-in-out;
      display: inline-block;
    }

    @keyframes bounceHand {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(8px); }
    }
  </style>
</head>
<body>

  <div class="container text-center py-5">
    
    <!-- LOGO MIAN -->
    <div class="mb-5">
      <img src="Images/logo.png" alt="MIAN Logo" class="logo-img img-fluid">
    </div>

    <h2 class="fw-bold mb-4" style="color: var(--primary-neon); letter-spacing: 2px;">SELECCIONA UN SET</h2>

    <!-- BARRA DE BÚSQUEDA -->
    <div class="row justify-content-center mb-5">
      <div class="col-md-8 col-lg-5">
        <div class="input-group">
          <span class="input-group-text bg-dark border-secondary text-info">
            <i class="bi bi-search"></i>
          </span>
          <input 
            type="text" 
            id="search-input" 
            class="form-control bg-dark text-light border-secondary shadow-none" 
            placeholder="Buscar por título, género o artista..."
            autocomplete="off"
          >
        </div>
      </div>
    </div>

    <!-- GRID DE SETS (3 TARJETAS POR FILA) -->
    <div class="row g-4 justify-content-center" id="sets-container">
      <!-- Las tarjetas se generan dinámicamente desde el script -->
    </div>

  </div>

  <script>
    // LISTA MASTER DE SETS
    const sets = [
      {
        id: 1,
        title: "Digital Delirium",
        desc: "30 Tracks - Tech / Progressive / Bass",
        img: "Images/set1_11.png",
        url: "Sets/set1.html",
        colorPrimary: "#00f0ff",
        colorSecondary: "#ff007f",
        visible: true
      },
      {
        id: 2,
        title: "House Nation",
        desc: "14 Tracks - Vocal House / Festival EDM",
        img: "Images/set2_11.png",
        url: "Sets/set2.html",
        colorPrimary: "#ff9d00",
        colorSecondary: "#ff3300",
        visible: true
      },
      {
        id: 3,
        title: "deadmau5 Mix",
        desc: "15 Tracks - Progressive House / Electro",
        img: "Images/set3_11.jpg",
        url: "Sets/set3.html",
        colorPrimary: "#ff0055",
        colorSecondary: "#00ffcc",
        visible: true
      }
      /* Cuando hagas el Set 4, 5, 6... simplemente agregas el objeto aquí abajo */
    ];

    const container = document.getElementById('sets-container');
    const searchInput = document.getElementById('search-input');

    // DIBUJA Y FILTRA LOS SETS EN PANTALLA
    function renderSets(filterQuery = "") {
      container.innerHTML = "";
      const query = filterQuery.toLowerCase().trim();

      const filteredSets = sets.filter(set => {
        if (!set.visible) return false;
        const matchesTitle = set.title.toLowerCase().includes(query);
        const matchesDesc = set.desc.toLowerCase().includes(query);
        return matchesTitle || matchesDesc;
      });

      if (filteredSets.length === 0) {
        container.innerHTML = `
          <div class="col-12 my-4">
            <p class="text-muted">No se encontraron sets que coincidan con "${filterQuery}".</p>
          </div>`;
        return;
      }

      filteredSets.forEach(set => {
        const cardCol = document.createElement('div');
        cardCol.className = 'col-12 col-md-6 col-lg-4';
        
        cardCol.innerHTML = `
          <a href="${set.url}" class="set-card" style="border-color: ${set.colorPrimary}40;">
            <img src="${set.img}" alt="${set.title} Cover" class="cover-img mb-3" onerror="this.src='Images/set1_11.png'">
            <h4 class="fw-bold text-uppercase" style="color: ${set.colorPrimary};">${set.title}</h4>
            <p class="small mb-2" style="color:white;">${set.desc}</p>
            <div>
              <i class="bi bi-hand-index-thumb-fill pointing-hand me-1" style="color: ${set.colorPrimary};"></i>
              <span class="small fw-bold text-uppercase" style="color: ${set.colorSecondary};">Escuchar Set ${set.id}</span>
            </div>
          </a>
        `;
        container.appendChild(cardCol);
      });
    }

    // Escuchar la búsqueda en tiempo real
    searchInput.addEventListener('input', (e) => {
      renderSets(e.target.value);
    });

    // Carga inicial
    renderSets();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
